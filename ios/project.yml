# XcodeGen spec for the Faceforge iOS app. Generated on the macOS CI runner:
#   cd ios && xcodegen generate
# ios/Vendor/onnxruntime-spm is fetched by the workflow (see .github/workflows/build-ios.yml).
name: Faceforge
options:
  bundleIdPrefix: com.anchdev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
packages:
  FaceforgeCore:
    path: FaceforgeCore
  onnxruntime:
    path: Vendor/onnxruntime-spm
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: 0.9.20
targets:
  Faceforge:
    type: application
    platform: iOS
    sources:
      - path: Faceforge
    dependencies:
      - package: FaceforgeCore
      - package: onnxruntime
        product: onnxruntime
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anchdev.faceforge
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Faceforge/Info.plist
        ENABLE_BITCODE: NO
    info:
      path: Faceforge/Info.plist
      properties:
        CFBundleDisplayName: Faceforge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Faceforge uses the front camera for live face swapping. Frames stay on this iPhone, or go only to your own PC in PC offload mode."
        NSLocalNetworkUsageDescription: "Faceforge connects to the Faceforge server on your own PC to offload face swapping to its GPU."
        NSBonjourServices: [_faceforge._tcp]
        NSPhotoLibraryAddUsageDescription: "Faceforge saves swapped photos to your library when you tap Save."
