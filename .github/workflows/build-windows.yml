name: Build Faceforge (Windows)
# Registered on the default branch so it can be started from the Actions tab.

# Manual only. Releases are created as DRAFTS unless "publish" is ticked, so
# nothing becomes public without a person approving it.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream Deep-Live-Cam ref (blank = commit pinned in patches/UPSTREAM.lock)'
        type: string
        default: ''
      publish:
        description: 'Publish the release (otherwise it stays a draft)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: hacksider/Deep-Live-Cam
  PYTHON_VERSION: '3.11'
  ORT_GPU: onnxruntime-gpu==1.26.0            # links cudart64_12, cublas(Lt)64_12, cufft64_11, cudnn64_9
  ORT_DML: onnxruntime-directml==1.24.4       # bundles DirectML.dll 1.15.4
  ORT_OPENVINO: onnxruntime-openvino==1.24.1  # Windows wheel does NOT include openvino.dll ...
  OPENVINO_RUNTIME: openvino==2025.4.1        # ... so ship this exact build (2025.4.1.20426)
  FP16_CONVERTER: onnxconverter-common==1.16.0
  PYINSTALLER: pyinstaller==6.22.3

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  check:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      short: ${{ steps.ref.outputs.short }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: |
          REF="${{ inputs.ref }}"
          if [ -n "$REF" ]; then
            SHA=$(git ls-remote "https://github.com/$UPSTREAM_REPO.git" "$REF" | head -1 | cut -f1)
            [ -z "$SHA" ] && SHA="$REF"
          else
            SHA=$(sed -n 's/^commit=//p' patches/UPSTREAM.lock)
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=win-${SHA:0:7}-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "Building upstream $UPSTREAM_REPO@$SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Faceforge for Windows, built from [$UPSTREAM_REPO@${{ needs.check.outputs.short }}](https://github.com/$UPSTREAM_REPO/commit/${{ needs.check.outputs.sha }}) with the Faceforge patches."
            echo
            cat docs/release-notes-windows.md
          } > notes.md
          gh release create "${{ needs.check.outputs.tag }}" --repo "${{ github.repository }}" \
            --title "Faceforge Windows ${{ needs.check.outputs.short }}" --notes-file notes.md --draft

  build:
    needs: [check, release]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [directml, cuda, openvino]
        include:
          - variant: directml
            provider: dml
          - variant: cuda
            provider: cuda
          - variant: openvino
            provider: openvino
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: faceforge

      - name: Clone upstream
        run: |
          git clone "https://github.com/$UPSTREAM_REPO.git" upstream
          git -C upstream checkout "${{ needs.check.outputs.sha }}"

      - name: Apply Faceforge patches
        run: python faceforge/patches/apply_faceforge.py upstream

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: upstream/requirements.txt

      - name: Install dependencies
        run: |
          cd upstream
          python -m pip install --upgrade pip wheel
          # Drop packages we replace or don't ship:
          #  - onnxruntime*: installed per variant below
          #  - opencv-python: the headless build is enough (UI is PySide6)
          #  - opennsfw2/keras: NSFW filter needs a deep-learning backend (GBs)
          grep -viE '^(onnxruntime|opencv-python==|opennsfw2|keras)' requirements.txt > req-faceforge.txt
          pip install -r req-faceforge.txt
          pip uninstall -y onnxruntime onnxruntime-gpu onnxruntime-directml onnxruntime-openvino torch tensorflow 2>/dev/null || true
          case "${{ matrix.variant }}" in
            cuda)     pip install "$ORT_GPU" ;;
            directml) pip install "$ORT_DML" ;;
            openvino) pip install "$ORT_OPENVINO" "$OPENVINO_RUNTIME" ;;
          esac
          pip install "$FP16_CONVERTER" "$PYINSTALLER"
          pip freeze > ../pip-freeze-${{ matrix.variant }}.txt
          python -c "import onnxruntime as o; print(o.__version__, o.get_available_providers())"

      - name: Download FFmpeg
        run: |
          curl -fL -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          7z x ffmpeg.zip -offmpeg_tmp > /dev/null

      - name: Build with PyInstaller
        env:
          FACEFORGE_VARIANT: ${{ matrix.variant }}
        run: |
          cd upstream
          set +e
          pyinstaller ../faceforge/build/faceforge.spec --noconfirm --distpath dist --workpath build > pyinstaller.log 2>&1
          rc=$?
          set -e
          tail -30 pyinstaller.log
          if [ "$rc" -ne 0 ]; then bash ../faceforge/ios/ci/annotate.sh pyinstaller.log "PyInstaller"; fi
          exit "$rc"

      - name: Assemble app folder
        run: |
          APP=upstream/dist/Faceforge
          cp ffmpeg_tmp/ffmpeg-*/bin/ffmpeg.exe ffmpeg_tmp/ffmpeg-*/bin/ffprobe.exe "$APP/"
          if [ "${{ matrix.variant }}" = "cuda" ]; then
            cp faceforge/build/launchers/Faceforge-cuda.bat "$APP/Faceforge.bat"
          else
            sed "s/__PROVIDER__/${{ matrix.provider }}/" faceforge/build/launchers/Faceforge.bat > "$APP/Faceforge.bat"
          fi
          cp faceforge/docs/README-windows.txt "$APP/README.txt"
          cp pip-freeze-${{ matrix.variant }}.txt "$APP/BUILD-DEPENDENCIES.txt"
          # Guard: release zips must not contain model weights (any ONNX file over 1 MB).
          if find "$APP" -iname "*.onnx" -size +1M | grep -q .; then
            echo "::error::Model weights found in the app folder"; find "$APP" -iname "*.onnx" -size +1M; exit 1
          fi
          du -sh "$APP"

      - name: Smoke test - app starts
        run: |
          cd upstream/dist/Faceforge
          ./Faceforge.exe --version
          timeout 40 ./Faceforge.exe --execution-provider ${{ matrix.provider }} || code=$?
          if [ "${code:-0}" -ne 124 ]; then echo "App exited early with code ${code}"; exit 1; fi

      - name: Smoke test - backend loads
        env:
          FACEFORGE_SELFTEST: ${{ matrix.provider }}
        run: |
          cd upstream/dist/Faceforge
          set +e
          ./Faceforge.exe --execution-provider ${{ matrix.provider }} 2>&1 | tee selftest.log
          code=${PIPESTATUS[0]}
          set -e
          echo "### ${{ matrix.variant }} self-test (exit $code)" >> "$GITHUB_STEP_SUMMARY"
          grep "\[selftest\]" selftest.log >> "$GITHUB_STEP_SUMMARY" || true
          case "${{ matrix.variant }}" in
            openvino)
              # OpenVINO's CPU device exists on every runner: must load.
              [ "$code" -eq 0 ] || { echo "::error::OpenVINO provider did not load"; exit 1; } ;;
            cuda)
              # Runners have no NVIDIA GPU: expect an honest failure that names the missing DLLs.
              [ "$code" -eq 3 ] || { echo "::error::expected exit 3 (no GPU), got $code"; exit 1; }
              grep -q "could not be loaded" selftest.log || { echo "::error::missing-DLL diagnostic not shown"; exit 1; } ;;
            directml)
              # Runners have only a software adapter; record the result without failing.
              [ "$code" -eq 0 ] || echo "::warning::DirectML did not load on the runner's software adapter (exit $code)" ;;
          esac

      - name: Zip and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f upstream/dist/Faceforge/selftest.log
          cd upstream/dist
          7z a -mx1 "../../Faceforge-windows-${{ matrix.variant }}.zip" Faceforge/ > /dev/null
          cd ../..
          gh release upload "${{ needs.check.outputs.tag }}" "Faceforge-windows-${{ matrix.variant }}.zip" \
            --repo "${{ github.repository }}"

  publish:
    needs: [check, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.check.outputs.tag }}" --repo "${{ github.repository }}" \
            --draft=false --latest
